<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      const path = window.location.pathname;
      const repo = "/prernachhajer";

      if (path.startsWith(repo)) {
        const route = path.slice(repo.length) || "/";
        window.location.replace(
          repo + "/#" + route
        );
      } else {
        window.location.replace(repo + "/");
      }
    </script>
  </head>
  <body></body>
</html>
